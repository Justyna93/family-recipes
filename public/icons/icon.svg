<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Light blue circular background -->
  <circle cx="256" cy="256" r="256" fill="#7dd3fc"/>
  <!-- Subtle inner shadow on the circle -->
  <circle cx="256" cy="256" r="256" fill="url(#shade)"/>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <!-- Steam lines above the pot -->
  <g fill="none" stroke="white" stroke-width="14" stroke-linecap="round">
    <path d="M190 210 Q205 175, 190 140 Q175 105, 190 75"/>
    <path d="M256 215 Q271 180, 256 145 Q241 110, 256 80"/>
    <path d="M322 210 Q337 175, 322 140 Q307 105, 322 75"/>
  </g>

  <!-- Pot body -->
  <g fill="white">
    <!-- Lid top rim -->
    <rect x="128" y="228" width="256" height="22" rx="8"/>
    <!-- Main body, slightly wider at top -->
    <path d="M140 256
             L372 256
             L362 412
             Q360 428, 344 428
             L168 428
             Q152 428, 150 412 Z"/>
    <!-- Left handle -->
    <rect x="100" y="276" width="36" height="22" rx="6"/>
    <!-- Right handle -->
    <rect x="376" y="276" width="36" height="22" rx="6"/>
  </g>

  <!-- Three dots/buttons on the pot front -->
  <g fill="#7dd3fc">
    <circle cx="212" cy="348" r="10"/>
    <circle cx="256" cy="348" r="10"/>
    <circle cx="300" cy="348" r="10"/>
  </g>
</svg>
